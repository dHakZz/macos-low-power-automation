name: Report a Bug
description: Report an installation, menu-bar, switching, diagnostics, or removal problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Low Power Automation. Before submitting, choose **Diagnostics…** from the menu-bar icon. Remove names, serial numbers, and personal file paths from anything you share.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "2.0.0 Beta 1"
    validations: {required: true}
  - type: input
    id: mac
    attributes:
      label: Mac model and processor
      placeholder: "MacBook Air (M4) or MacBook Pro (Intel Core i7)"
    validations: {required: true}
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 26.6"
    validations: {required: true}
  - type: input
    id: thresholds
    attributes:
      label: On/off thresholds and plugged-in choice
      placeholder: "On at 40%, off at 50%, Automatic while plugged in"
    validations: {required: true}
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Installation or upgrade
        - Menu-bar app or icon
        - Battery switching
        - Plugged-in behavior
        - Pause, Check Now, or settings
        - Diagnostics or logging
        - Uninstallation or restoration
        - Other
    validations: {required: true}
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics results
      description: Paste the text shown by Diagnostics, with personal information removed.
    validations: {required: true}
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the menu-bar icon.
        2. Set...
        3. Observe...
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations: {required: true}
  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I checked that an open issue does not already describe this problem.
          required: true
        - label: I removed personal information from screenshots, diagnostics, and logs.
          required: true
