name: Report a Bug
description: Tell us about an installation, threshold, Low Power Mode, or uninstallation problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Low Power Automation.

        Please remove names, serial numbers, file paths, and other personal information from screenshots or logs before attaching them.

  - type: input
    id: automation-version
    attributes:
      label: Low Power Automation version
      description: Use the version shown on the downloaded release.
      placeholder: "1.0.0 Beta 1"
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: Find this under Apple menu > About This Mac.
      placeholder: "macOS 26.6"
    validations:
      required: true

  - type: input
    id: mac-model
    attributes:
      label: Mac model
      placeholder: "MacBook Neo"
    validations:
      required: true

  - type: input
    id: processor
    attributes:
      label: Chip or processor
      placeholder: "Apple A18 Pro, Apple M4, or Intel Core i7"
    validations:
      required: true

  - type: input
    id: threshold
    attributes:
      label: Selected battery threshold
      placeholder: "50%"
    validations:
      required: true

  - type: dropdown
    id: affected-area
    attributes:
      label: Where did the problem occur?
      options:
        - Installation
        - Automatic switching while on battery
        - Behavior while connected to power
        - Changing the threshold
        - Uninstallation or settings restoration
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Give a short, clear description of the problem.
      placeholder: "Low Power Mode stayed off after the battery dropped below my selected threshold."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the exact steps that make the problem happen.
      placeholder: |
        1. Install with a 50% threshold.
        2. Disconnect the power adapter.
        3. Let the battery fall to 49%.
        4. Wait at least 60 seconds.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: "Low Power Mode should turn on within 60 seconds."
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Often
        - Sometimes
        - Once
    validations:
      required: true

  - type: textarea
    id: extra-context
    attributes:
      label: Error messages, screenshots, or extra context
      description: Optional. Remove personal information before attaching anything.
      placeholder: "Paste the complete error message or add other useful details."

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I checked that another open issue does not already describe this problem.
          required: true
        - label: I removed personal information from screenshots and logs.
          required: true
