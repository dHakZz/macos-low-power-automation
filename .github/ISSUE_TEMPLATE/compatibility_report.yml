name: Compatibility / Device Report
description: Share how Low Power Automation works on your Mac and macOS version.
title: "[Compatibility]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your setup. Reports where everything works are just as useful as reports about problems.

        Do not include your Mac's serial number or other personal information.

  - type: input
    id: mac-model
    attributes:
      label: Mac model
      placeholder: "MacBook Neo"
    validations:
      required: true

  - type: input
    id: processor
    attributes:
      label: Chip or processor
      placeholder: "Apple A18 Pro, Apple M4, or Intel Core i7"
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "macOS 26.6"
    validations:
      required: true

  - type: input
    id: automation-version
    attributes:
      label: Low Power Automation version
      placeholder: "1.0.0 Beta 1"
    validations:
      required: true

  - type: input
    id: threshold
    attributes:
      label: Selected battery threshold
      placeholder: "50%"
    validations:
      required: true

  - type: dropdown
    id: installation-result
    attributes:
      label: Installation result
      options:
        - Installed successfully
        - Installed after using Control-click > Open
        - Installation failed
    validations:
      required: true

  - type: checkboxes
    id: scenarios-tested
    attributes:
      label: Power scenarios tested
      description: Select every scenario you tried.
      options:
        - label: On battery at or below the selected threshold
        - label: On battery above the selected threshold
        - label: Connected to power

  - type: dropdown
    id: automatic-switching
    attributes:
      label: Automatic switching result
      options:
        - Works correctly
        - Partially works
        - Does not work
        - Not tested
    validations:
      required: true

  - type: dropdown
    id: threshold-change
    attributes:
      label: Threshold-changing result
      options:
        - Works correctly
        - Does not work
        - Not tested
    validations:
      required: true

  - type: dropdown
    id: uninstall-result
    attributes:
      label: Uninstallation result
      options:
        - Removed the automation and restored previous settings
        - Removed the automation, but settings restoration was not verified
        - Did not work
        - Not tested
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: What worked or did not work?
      description: Describe the behavior you observed in the scenarios you tested.
      placeholder: "Low Power Mode switched correctly in every power scenario I tested."
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Extra notes
      description: Optional. Share any setup details that could help other users.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include a serial number or other personal information.
          required: true
