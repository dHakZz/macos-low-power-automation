name: Compatibility / Device Report
description: Share how version 2 works on your Mac and macOS version.
title: "[Compatibility]: "
body:
  - type: markdown
    attributes:
      value: |
        Successful reports are just as useful as problems. Do not include your Mac's serial number or other personal information.
  - type: input
    id: mac
    attributes:
      label: Mac model and processor
      placeholder: "MacBook Air (M4) or MacBook Pro (Intel Core i7)"
    validations: {required: true}
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: Low Power Automation version
      placeholder: "2.0.0 Beta 1"
    validations: {required: true}
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options: [Apple silicon, Intel]
    validations: {required: true}
  - type: checkboxes
    id: scenarios
    attributes:
      label: Features tested
      options:
        - label: Fresh installation
        - label: Upgrade from version 1
        - label: Menu-bar icon and controls
        - label: Low Power Mode at the on threshold
        - label: Recovery at the off threshold
        - label: Plugged-in behavior
        - label: Pause and resume
        - label: Check Now and Diagnostics
        - label: Uninstall and settings restoration
  - type: dropdown
    id: result
    attributes:
      label: Overall result
      options: [Everything worked, Mostly worked, Did not work]
    validations: {required: true}
  - type: textarea
    id: notes
    attributes:
      label: Results and notes
    validations: {required: true}
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include a serial number or other personal information.
          required: true
